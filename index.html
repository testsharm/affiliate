<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>PromptPad — Premium AI Prompts Vault</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box !important;
    }
    html, body {
      max-width: 100vw !important;
      overflow-x: hidden !important;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #f8fafc;
      color: #0f172a;
      -webkit-tap-highlight-color: transparent;
    }
    .code-font {
      font-family: 'JetBrains Mono', monospace;
    }
    .price-token, .price-display, b, span.price {
      white-space: nowrap !important;
      display: inline-block;
    }
    .pv, .full, .prompt-code-shell {
      background: #0b0f19 !important;
      border: 1px solid rgba(255, 255, 255, 0.12) !important;
      border-radius: 12px !important;
      padding: 14px 16px !important;
      box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.4) !important;
      font-family: 'JetBrains Mono', monospace !important;
      color: #e2e8f0 !important;
      font-size: 0.8125rem !important;
      line-height: 1.6 !important;
      max-width: 100% !important;
      overflow-x: auto !important;
      white-space: pre-wrap !important;
      word-break: break-word !important;
    }
    mark.ph, .placeholder-badge {
      background: rgba(139, 92, 246, 0.22) !important;
      border: 1px solid rgba(167, 139, 250, 0.45) !important;
      color: #ddd6fe !important;
      padding: 2px 7px !important;
      border-radius: 6px !important;
      font-weight: 600 !important;
      font-size: 0.75rem !important;
      display: inline-block !important;
      margin: 1px 2px !important;
    }
    .app-wrapper {
      max-width: 1200px;
      margin: 0 auto;
      padding: 1rem;
      padding-bottom: calc(120px + env(safe-area-inset-bottom)) !important;
    }
    .stk-banner {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(15, 23, 42, 0.96);
      backdrop-filter: blur(12px);
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      z-index: 50;
      padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    }
    @media (max-width: 767px) {
      .chk, section#check {
        display: flex !important;
        flex-direction: column !important;
        width: 100% !important;
        max-width: 100% !important;
      }
      h1, h2, .hero-title {
        font-size: clamp(1.4rem, 5vw, 2rem) !important;
        line-height: 1.25 !important;
      }
      button, a.btn {
        min-height: 44px !important;
        touch-action: manipulation;
      }
    }
  </style>
</head>
<body>

  <div class="app-wrapper">
    <header class="flex items-center justify-between py-4 mb-6 border-b border-slate-200">
      <div class="flex items-center gap-2">
        <div class="w-9 h-9 rounded-xl bg-indigo-600 flex items-center justify-center font-bold text-xl text-white shadow-md">P</div>
        <span class="text-xl font-extrabold tracking-tight text-slate-900">PromptPad</span>
      </div>
      <a href="https://toolsuite.com" target="_blank" class="px-4 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-xs font-semibold text-slate-700 border border-slate-200 transition-all">
        Our pick: <span class="text-indigo-600 font-bold">ToolSuite</span>
      </a>
    </header>

    <main id="grid" class="space-y-6">
      <div class="text-center py-12 text-slate-400 font-medium">Loading production vault...</div>
    </main>

    <section class="chk bg-slate-900 text-white rounded-2xl p-6 my-10 shadow-xl" id="check">
      <div class="space-y-4">
        <span class="inline-block px-3 py-1 bg-amber-400 text-slate-950 font-bold text-xs rounded-full">Quick check</span>
        <h2 class="text-2xl font-extrabold tracking-tight leading-snug">What do your tools cost you now?</h2>
        <p class="text-slate-400 text-sm leading-relaxed">
          Pick what you make, type what you pay for each tool today, and see how it compares with ToolSuite's listed <span class="price-token text-white font-bold">$29.95</span> a month.
        </p>
      </div>
    </section>
  </div>

  <div class="stk-banner flex items-center justify-between max-w-4xl mx-auto">
    <div class="flex flex-col">
      <span class="text-xs text-slate-400 font-medium">ToolSuite · 50+ tools</span>
      <span class="text-sm font-bold text-white">from <span class="price-token">$29.95</span>/mo</span>
    </div>
    <a href="https://toolsuite.com" target="_blank" class="px-5 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-xs font-bold text-white transition-all shadow-lg shadow-indigo-500/30">
      Check it out
    </a>
  </div>

  <script>
    async function initVault() {
      try {
        const res = await fetch('/api/data.js?t=' + Date.now());
        const data = await res.json();
        const grid = document.getElementById('grid');
        grid.innerHTML = '';

        data.prompts.forEach((p) => {
          const formatted = p.content.replace(/\[([^\]]+)\]/g, '<mark class="ph">[$1]</mark>');
          const card = document.createElement('div');
          card.className = 'bg-white rounded-2xl p-5 border border-slate-200/80 shadow-sm space-y-4';
          card.innerHTML = `
            <div class="flex items-center justify-between">
              <span class="text-xs font-semibold px-2.5 py-1 rounded-md bg-slate-100 text-indigo-600 border border-slate-200">${p.category || 'General'}</span>
              <span class="text-xs text-slate-400 font-mono">${p.word_count || 0} words</span>
            </div>
            <h3 class="text-lg font-bold text-slate-900 tracking-tight">${p.title}</h3>
            <div class="pv code-font">${formatted}</div>
            <div class="pt-2 flex items-center justify-end gap-3">
              <button onclick="copyPrompt('${encodeURIComponent(p.content)}', this)" class="w-full sm:w-auto px-5 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-xs font-bold text-white transition-all shadow-md">
                Copy prompt
              </button>
            </div>
          `;
          grid.appendChild(card);
        });
      } catch (err) {
        console.error("Vault load error:", err);
      }
    }

    function copyPrompt(encodedText, btn) {
      navigator.clipboard.writeText(decodeURIComponent(encodedText)).then(() => {
        const orig = btn.innerText;
        btn.innerText = 'Copied!';
        btn.classList.replace('bg-indigo-600', 'bg-emerald-600');
        setTimeout(() => {
          btn.innerText = orig;
          btn.classList.replace('bg-emerald-600', 'bg-indigo-600');
        }, 2000);
      });
    }

    initVault();
  </script>
</body>
</html>
